<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twitch AI Overlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial; overflow:hidden}
#box{position:fixed;bottom:20px;left:20px;right:20px;background:rgba(0,0,0,0.85);border:1px solid #333;border-radius:16px;padding:16px 20px;backdrop-filter:blur(8px);transform:translateY(120%);transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);max-width:900px}
#box.show{transform:translateY(0)}
#user{font-size:12px;color:#888;margin-bottom:4px}
#user b{color:#4ade80}
#question{font-size:13px;color:#aaa;margin-bottom:8px;font-style:italic}
#answer{font-size:18px;font-weight:700;line-height:1.3;color:#fff}
#time{font-size:10px;color:#555;margin-top:6px;text-align:right}
#idle{position:fixed;bottom:20px;left:20px;background:rgba(0,0,0,0.6);padding:8px 14px;border-radius:20px;font-size:11px;color:#666;border:1px solid #222}
</style>
</head>
<body>
<div id="box">
<div id="user"></div>
<div id="question"></div>
<div id="answer">Ожидаю сообщения из чата...</div>
<div id="time"></div>
</div>
<div id="idle">🎙️ Twitch AI — слушает чат 24/7 — только голос, не пишет в чат</div>

<script>
let lastTime = "";
let hideTimer = null;

async function fetchData(){
  try{
    const res = await fetch('/api/data?t='+Date.now());
    const data = await res.json();
    if(data.time && data.time !== lastTime && data.answer){
      lastTime = data.time;
      document.getElementById('user').innerHTML = `<b>${data.user}</b> спросил:`;
      document.getElementById('question').textContent = `"${data.question}"`;
      document.getElementById('answer').textContent = data.answer;
      document.getElementById('time').textContent = data.time;
      const box = document.getElementById('box');
      box.classList.add('show');
      document.getElementById('idle').style.display='none';
      clearTimeout(hideTimer);
      // Скрыть через 12 сек
      hideTimer = setTimeout(()=>{
        box.classList.remove('show');
        document.getElementById('idle').style.display='block';
      }, 12000);
    }
  }catch(e){
    // console.log(e);
  }
}
setInterval(fetchData, 1000);
fetchData();
</script>
</body>
</html>

name: Build Universal AI Agent APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android || echo "android exists"
          npx cap sync

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-ai-agent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release (автообновление для всех)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "AI Agent APK v1.0.${{ github.run_number }}"
          body: |
            🔔 Автообновление! Новая версия APK
            
            Что нового:
            - Чат история сохраняется
            - Гостевой режим с одобрением
            - Монтаж ТикТок 9:16
            - Linux Codespace связь
            - Все настройки сохраняются
            
            Как обновиться:
            1. Скачай app-debug.apk из этого релиза
            2. Установи поверх старой (чаты/ключи сохранятся)
            3. Или в приложении Настройки -> Проверить обновление -> Скачать
            
            Не надо кидать каждому вручную - приложение само проверяет GitHub Releases!
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version file for auto-updater
        if: github.ref == 'refs/heads/main'
        run: |
          echo "{\"version\":\"1.0.${{ github.run_number }}\",\"apk\":\"https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-debug.apk\",\"notes\":\"Автообновление через GitHub Releases\"}" > update.json
          echo "Version file created"
